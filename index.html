<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Atemschutzüberwachung</title>
<meta name="theme-color" content="#B3121F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Roboto+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF0EE; --panel:#FFFFFF; --panel-2:#F6F7F6; --ink:#15191C; --ink-2:#4A5358; --ink-3:#7A8388;
  --line:#D3D8D6; --line-2:#B9C0BD;
  --red:#B3121F; --red-ink:#FFFFFF; --red-soft:#FBE7E8;
  --amber:#B86E00; --amber-soft:#FFF1D6; --green:#1D6B45; --green-soft:#E1F2E8; --blue:#1F4E79; --blue-soft:#E3EDF6;
  --focus:#1F4E79;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1214; --panel:#181D20; --panel-2:#1F2528; --ink:#E7ECEA; --ink-2:#AAB4B8; --ink-3:#7C878C;
    --line:#2B3337; --line-2:#3C464B;
    --red:#E0414B; --red-ink:#FFFFFF; --red-soft:#3A1719;
    --amber:#F0A83A; --amber-soft:#3A2A10; --green:#4CC08A; --green-soft:#12301F; --blue:#7FB2E3; --blue-soft:#15283A; --focus:#7FB2E3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1214; --panel:#181D20; --panel-2:#1F2528; --ink:#E7ECEA; --ink-2:#AAB4B8; --ink-3:#7C878C;
  --line:#2B3337; --line-2:#3C464B;
  --red:#E0414B; --red-ink:#FFFFFF; --red-soft:#3A1719;
  --amber:#F0A83A; --amber-soft:#3A2A10; --green:#4CC08A; --green-soft:#12301F; --blue:#7FB2E3; --blue-soft:#15283A; --focus:#7FB2E3;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 32px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);margin-inline:-16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px}
.wappen{width:30px;height:39px;flex:none;display:block}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:none}
.brand h1{font-size:24px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;flex:1;min-width:0;color:var(--ink-2);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.clock{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-family:var(--f-disp);font-weight:600;font-size:18px;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.sample-note{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:8px;padding:8px 12px;font-size:14px;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;min-height:44px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* Overview */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:16px 12px}
.toolbar h2{font-size:22px;margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card.st-warn{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber) inset}
.card.st-alarm{border-color:var(--red);box-shadow:0 0 0 3px var(--red) inset}
.card.st-alarm .card-head{background:var(--red-soft)}
.card.st-done{opacity:.8}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:24px;line-height:1.05}
.card-head .auftrag{color:var(--ink-2);font-size:15px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-idle{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}
.p-run{background:var(--blue-soft);color:var(--blue)}
.p-ziel{background:var(--green-soft);color:var(--green)}
.p-warn{background:var(--amber-soft);color:var(--amber)}
.p-alarm{background:var(--red);color:var(--red-ink)}
.p-done{background:var(--panel-2);color:var(--ink-3);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:10px 14px;min-width:0;background:var(--panel)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:13px;color:var(--ink-2);line-height:1.25}
.kpi.alarm .v{color:var(--red)}
.kpi.warn .v{color:var(--amber)}
.alert{display:flex;gap:10px;align-items:center;padding:8px 14px;font-weight:600;font-size:15px}
.alert.warn{background:var(--amber-soft);color:var(--ink)}
.alert.alarm{background:var(--red);color:var(--red-ink)}
@media (prefers-reduced-motion:no-preference){ .alert.alarm{animation:blink 1s steps(2,start) infinite} }
@keyframes blink{50%{background:var(--red-soft);color:var(--red)}}

.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.step{appearance:none;border:0;background:var(--panel);padding:8px 8px 10px;text-align:left;cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:3px;min-width:0}
.step .sl{font-family:var(--f-disp);font-weight:600;font-size:15px;line-height:1.1;color:var(--ink-2)}
.step .st{font-family:var(--f-mono);font-size:17px;font-weight:600}
.step .sp{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);line-height:1.3;overflow-wrap:anywhere}
.step.done{background:var(--panel-2)}
.step.done .sl{color:var(--ink)}
.step.todo .st{color:var(--ink-3)}
.step.next{background:var(--red);}
.step.next .sl,.step.next .st,.step.next .sp{color:var(--red-ink)}
.step.due{background:var(--amber-soft)}
.step.calc{background:repeating-linear-gradient(135deg,var(--panel-2) 0 6px,var(--panel) 6px 12px);cursor:default}
.step[disabled]{cursor:not-allowed}
.step[disabled] .sl{color:var(--ink-3)}
.members{padding:8px 14px;display:grid;gap:2px;font-size:14px;color:var(--ink-2)}
.members div{display:flex;gap:8px;flex-wrap:wrap}
.members b{color:var(--ink);font-weight:600;min-width:9ch}
.card-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);margin-top:auto;align-items:center}
.card-foot .note{flex:1;min-width:12ch;font-size:14px;color:var(--ink-2)}
.btn.notruf{background:var(--panel);border:2px solid var(--red);color:var(--red);font-family:var(--f-disp);font-size:17px;letter-spacing:.04em}
.btn.notruf.on{background:var(--red);color:var(--red-ink)}
.statusbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sttile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;border-top:4px solid var(--c)}
.sttile .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-2)}
.sttile .n{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.sttile .n b{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1}
.sttile .n span{font-size:14px;color:var(--ink-2)}
.sendline{font-size:13px;color:var(--ink-3);margin:-6px 0 12px}
.sendline.bad{color:var(--red);font-weight:600}
@media (max-width:640px){ .statusbar{grid-template-columns:1fr} }
.ovlist{display:grid;gap:8px}
.ovhead,.ovrow{display:grid;grid-template-columns:196px minmax(0,1.3fr) minmax(0,2fr) 150px 170px 24px;gap:12px;align-items:center;padding:10px 14px}
.ovhead{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-3);padding-block:0}
.ovrow{appearance:none;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line-2);border-radius:var(--r);cursor:pointer;min-height:68px;color:var(--ink)}
.ovrow:hover{border-color:var(--ink-3)}
.ovrow.g1{border-left-color:var(--green)} .ovrow.g2{border-left-color:var(--blue)} .ovrow.g4{opacity:.7}
.ovrow.st-warn{background:var(--amber-soft);border-color:var(--amber)} .ovrow.st-alarm{background:var(--red-soft);border-color:var(--red);border-left-color:var(--red)}
.ovrow .rg{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1}
.ovrow .au{color:var(--ink-2);font-size:15px}
.ovrow .tm{display:flex;flex-direction:column;line-height:1.15}
.ovrow .tm b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.ovrow .tm span{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.ovrow .tm.warn b{color:var(--amber)} .ovrow .tm.alarm b{color:var(--red)}
.ovrow .chev{font-size:24px;color:var(--ink-3)}
.ovrow .alm{grid-column:2/-1;font-size:14px;font-weight:700;color:var(--red)}
.ovrow .alm.w{color:var(--amber)}
.backbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-block:16px 12px}
.grid.single{grid-template-columns:1fr}
@media (max-width:900px){
  .ovhead{display:none}
  .ovrow{grid-template-columns:1fr 1fr;row-gap:6px}
  .ovrow .chev{display:none}
  .ovrow .alm{grid-column:1/-1}
}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.blink{background:var(--amber-soft)}
.kpi.blink .v{color:var(--amber)}
@media (prefers-reduced-motion:no-preference){
  .kpi.blink,.tm.blink{animation:nqblink .5s steps(2,start) infinite}
  @keyframes nqblink{50%{background:var(--amber);}}
}
.tm.blink{background:var(--amber-soft);border-radius:6px;padding:2px 6px;margin:-2px -6px}
.mtable{display:grid;padding:4px 14px 8px;border-bottom:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px 96px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow.mh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--ink-3);padding-block:6px 2px}
.mrow .mf{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;text-align:center;padding:2px 0}
.mrow .mn{font-weight:600;font-size:16px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.mrow .mn small{display:block;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink-3)}
.mrow .mp{font-family:var(--f-mono);font-size:24px;font-weight:600;text-align:right}
.mrow .mp small{font-size:12px;color:var(--ink-3)}
.mrow .mp.low{color:var(--red)}
.mrow .mr{font-family:var(--f-mono);font-size:14px;color:var(--ink-2);text-align:right}
.mrow.mh span:nth-child(n+3){text-align:right}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:10px 14px}
.tl-step{appearance:none;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tl-step .tl-l{font-family:var(--f-disp);font-weight:600;font-size:14px;line-height:1.1;color:var(--ink-2);display:flex;align-items:flex-start;gap:3px;min-height:2.2em}
.tl-step .tl-t{font-family:var(--f-mono);font-size:14px;color:var(--ink-3);white-space:nowrap}
.tl-step.done{background:var(--panel-2)}
.tl-step.done .tl-l{color:var(--green)} .tl-step.done .tl-t{color:var(--ink);font-weight:600}
.tl-step.next{border:2px solid var(--red)} .tl-step.next .tl-l{color:var(--red)}
.tl-step.due{background:var(--amber-soft);border-color:var(--amber)} .tl-step.due .tl-t{color:var(--ink)}
.tl-step[disabled]{opacity:.45;cursor:not-allowed}
.card > .note{padding:0 14px 8px;font-size:14px;color:var(--ink-2)}
.nextbtn{flex:1;min-height:52px;font-size:18px;font-family:var(--f-disp);letter-spacing:.02em}
.samebox{border:2px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.samebox label{display:flex;gap:10px;align-items:center;font-weight:700}
.samebox input{width:26px;height:26px;flex:none}
@media (max-width:640px){ .tl{grid-template-columns:repeat(3,minmax(0,1fr))} .kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))} .mrow{grid-template-columns:40px minmax(0,1fr) 84px 70px} .mrow .mp{font-size:20px} }
.empty{border:2px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2)}

/* Forms */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:8px 10px;font-size:17px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.inp.mono{font-family:var(--f-mono)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg.half{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.half button{padding-inline:8px}
.scanbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.chip.name{border-color:var(--green);background:var(--green-soft)}
.seg button{appearance:none;border:0;background:var(--panel);padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.section-title{font-size:20px;margin-block:22px 10px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{font-family:var(--f-disp);font-weight:600;font-size:15px;color:var(--ink-2);background:var(--panel-2);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.grp td{background:var(--panel-2);font-family:var(--f-disp);font-weight:700;font-size:17px}
.cell-inp{min-width:9ch}
.cam{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);border-radius:8px;width:44px;height:44px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.cam svg{width:22px;height:22px}
.withcam{display:flex;gap:6px;align-items:center}

/* Dialog */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,16,.55)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dlg-head h2{font-size:24px;flex:1}
.dlg-body{padding:16px 18px;display:grid;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.p-row{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center}
.p-row .who{font-weight:600}
.p-row .who small{display:block;color:var(--ink-3);font-weight:500}
.p-inp{font-family:var(--f-mono);font-size:26px;font-weight:600;min-height:56px;padding-right:36px;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;text-align-last:right}
/* Abfrage-Meldung */
dialog.prompt{border-top:8px solid var(--amber);width:min(560px,calc(100vw - 24px))}
dialog.prompt.alarm{border-top-color:var(--red)}
dialog.prompt .dlg-head h2{font-size:28px}
.prompt-big{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1}
.prompt-list{display:grid;gap:6px;font-size:16px}
.prompt-list div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:4px}
@media (prefers-reduced-motion:no-preference){
  dialog.prompt[open]{animation:unfold .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes unfold{from{transform:translateY(-40px) scaleY(.6);opacity:0}to{transform:none;opacity:1}}
}
.hint{font-size:14px;color:var(--ink-2)}
.err{color:var(--red);font-weight:600;font-size:14px}
.calcbox{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:8px 14px;font-family:var(--f-mono);font-size:16px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--ink-2)}
.chip.line{font-family:var(--f-body);border-radius:8px}
.scan-img{max-width:100%;max-height:260px;border-radius:8px;border:1px solid var(--line);display:block;object-fit:contain;background:var(--panel-2)}
.fieldtabs{display:flex;flex-wrap:wrap;gap:6px}
.fieldtab{appearance:none;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;min-width:110px}
.fieldtab small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.fieldtab span{font-family:var(--f-mono);font-size:15px}
.fieldtab[aria-pressed="true"]{border:2px solid var(--red);background:var(--red-soft)}
.progress{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--blue);width:0;transition:width .2s}
pre.json{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:420px;font-family:var(--f-mono);font-size:13px;margin:0}
.ref td,.ref th{text-align:center}
.ref td:first-child,.ref th:first-child{text-align:left}
.sofort{background:var(--red);color:var(--red-ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-weight:600;z-index:100;max-width:calc(100vw - 32px)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}

@media (max-width:640px){
  .rail{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:21px}
  .p-row{grid-template-columns:1fr 160px}
  .clock{font-size:22px}
}
</style>

  let last = null;

    const rd = [], mins = [];
    for(let i=0;i<n;i++){
      const a = ev.beginn.p[i], z = ev.ziel.p[i];
      const d = Math.max(c.minRueckzug, 2*(a - z));
      rd.push(d); mins.push((z - d)/c.verbrauch);
    }
    const m = Math.min(...mins);
    const sofort = m < 0.5;
    r.soll = {p:rd, min:sofort?0:Math.round(m), t: ev.ziel.t + (sofort?0:Math.round(m))*60000, sofort};
    // Prognose aus gemessenem Verbrauch (nach Einsatzort an)
    const later = ['k10','k20'].map(k=>ev[k]).filter(e=>e && e.t > ev.ziel.t + 60000).sort((a,b)=>b.t-a.t)[0];
    if(later){
      let best = Infinity;
      for(let i=0;i<n;i++){
        const rate = (ev.ziel.p[i]-later.p[i]) / ((later.t-ev.ziel.t)/60000);
        if(rate>0){ best = Math.min(best, (later.p[i]-rd[i])/rate); }
      }
      if(isFinite(best)) r.prog = {t: later.t + Math.max(0,best)*60000, rate:true};
    }
  }
  // Status
  if(ev.ende) r.status='done';
  else if(ev.rueckzug) r.status='rueck';
  else if(ev.ziel) r.status='ziel';
  else if(ev.beginn) r.status='run';
  // Warnungen / Alarme
  if(t.notfall && !ev.ende) r.alarms.push('ATEMSCHUTZNOTFALL seit '+hm(t.notfall));
  if(ev.beginn && !ev.ende){
    const el = now - ev.beginn.t;
    if(!ev.rueckzug){
      if(el >= 10*60000 && !ev.k10) r.warns.push('Druckabfrage 10 min fällig');
      if(el >= 20*60000 && !ev.k20) r.warns.push('Druckabfrage 20 min fällig');
      if(r.soll){
        if(r.soll.sofort) r.alarms.push('Rückzug sofort! Druck reicht nicht für Hin- und Rückweg');
        else if(now >= r.soll.t) r.alarms.push('Rückzugszeit erreicht – Trupp zurückrufen');
        else if(r.soll.t - now < 120000) r.warns.push('Rückzug in weniger als 2 Minuten');
        if(r.prog && now >= r.prog.t && !(now >= r.soll.t)) r.alarms.push('Rückzugsdruck laut Verbrauch erreicht');
      }
      if(r.soll && last && last !== ev.ziel){
        const under = last.p.some((p,i)=>p!=null && p <= r.soll.p[i]);
        if(under) r.alarms.push('Rückzugsdruck unterschritten');
      }
    }
    if(last && r.lowest != null && r.lowest <= c.minRueckzug) r.alarms.push('Druck ≤ '+c.minRueckzug+' bar');
  }
  return r;
}

// Sortierung überall: 1. Am Einsatzort, 2. unter Atemschutz (inkl. Rückzug), 3. Bereit, 4. Beendet
function rank(t){ const ev=t.ev; if(ev.ende) return 4; if(!ev.beginn) return 3; if(ev.ziel && !ev.rueckzug) return 1; return 2; }
function sortedTrupps(){ return S.trupps.map((t,i)=>[t,i]).sort((a,b)=>rank(a[0])-rank(b[0]) || a[1]-b[1]).map(x=>x[0]); }

// Nächste planmäßige Druckabfrage (10 / 20 min nach Beginn)
const QUERIES = [{k:'k10', min:10, l:'10-min-Abfrage'}, {k:'k20', min:20, l:'20-min-Abfrage'}];
function nextQuery(t){
  const ev=t.ev; if(!ev.beginn || ev.rueckzug || ev.ende) return null;
  for(const q of QUERIES){ if(!ev[q.k]) return {k:q.k, l:q.l, t:ev.beginn.t + q.min*60000}; }
  return null;
}

/* ---------- Überwachung ---------- */
let alarmSig = '';
function statusPill(r){
  if(r.alarms.length) return '<span class="pill p-alarm">Alarm</span>';
  if(r.warns.length) return '<span class="pill p-warn">Achtung</span>';
  return {idle:'<span class="pill p-idle">Bereit</span>', run:'<span class="pill p-run">Unter Atemschutz</span>', ziel:'<span class="pill p-ziel">Am Einsatzort</span>', rueck:'<span class="pill p-run">Rückzug</span>', done:'<span class="pill p-done">Beendet</span>'}[r.status];
}
function nextStep(t, r){
  const ev=t.ev;
  if(ev.ende) return null;
  if(!ev.beginn) return 'beginn';
  if(ev.rueckzug) return 'ende';
  const el = r.elapsed;
  if(el>=20*60000 && !ev.k20) return 'k20';
  if(el>=10*60000 && !ev.k10) return 'k10';
  if(!ev.ziel) return 'ziel';
  return 'rueckzug';
}
const CHECK_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
function tlStep(t, s, r, nxt){
  const ev=t.ev, e=ev[s.k];
  if(e) return '<button class="tl-step done" data-act="edit" data-t="'+t.id+'" data-s="'+s.k+'" aria-label="'+s.l+' '+hm(e.t)+' bearbeiten"><span class="tl-l">'+CHECK_SVG+s.l+'</span><span class="tl-t">'+hm(e.t)+'</span></button>';
  const disabled = (s.k!=='beginn' && !ev.beginn) || !!ev.ende;
  let sub='';
  if(s.k==='k10' && ev.beginn) sub='ab '+hm(ev.beginn.t+10*60000);
  if(s.k==='k20' && ev.beginn) sub='ab '+hm(ev.beginn.t+20*60000);
  const due = !disabled && ev.beginn && !ev.rueckzug && ((s.k==='k10' && Date.now()>=ev.beginn.t+600000) || (s.k==='k20' && Date.now()>=ev.beginn.t+1200000));
  return '<button class="tl-step'+(s.k===nxt?' next':'')+(due?' due':'')+'" data-act="step" data-t="'+t.id+'" data-s="'+s.k+'"'+(disabled?' disabled':'')+'><span class="tl-l">'+s.l+'</span><span class="tl-t">'+(sub||'--:--')+'</span></button>';
}
function lastReading(t){ let l=null; for(const s of EVSTEPS) if(t.ev[s.k] && (!l||t.ev[s.k].t>=l.t)) l=t.ev[s.k]; return l; }
function kpiHTML(t, r){
  const now = Date.now();
  const k1 = '<div class="kpi"><div class="l">Einsatzzeit</div><div class="v" data-live="el" data-t="'+t.id+'">'+(r.elapsed!=null?dur(r.elapsed):'--:--')+'</div><div class="s">'+(t.ev.beginn?'seit '+hm(t.ev.beginn.t):'noch nicht begonnen')+'</div></div>';
  const nq = nextQuery(t);
  let nqc='', nqv='--:--', nqs = t.ev.beginn ? (t.ev.rueckzug||t.ev.ende ? 'keine weitere' : 'alle erledigt') : 'ab Beginn';
  if(nq){ const left = nq.t - now; nqc = left<=0?'warn':(left<=10000?'blink':''); nqv = left<=0?'fällig':dur(left); nqs = nq.k.slice(1)+' min · '+hm(nq.t); }
  const k2 = '<div class="kpi '+nqc+'" data-blink="'+t.id+'"><div class="l">Nächste Abfrage</div><div class="v" data-live="nq" data-t="'+t.id+'">'+nqv+'</div><div class="s">'+esc(nqs)+'</div></div>';
  let cls='', v='--:--', s='nach „Einsatzort an“';
  if(t.ev.ende){ v='–'; s='beendet'; }
  else if(t.ev.rueckzug){ v=hm(t.ev.rueckzug.t); s='Rückzug angetreten'; }
  else if(r.soll){
    if(r.soll.sofort){ cls='alarm'; v='sofort!'; s='Druck zu gering'; }
    else { const left=r.soll.t-now; cls = left<=0?'alarm':(left<120000?'warn':''); v=dur(left); s='um '+hm(r.soll.t)+(r.prog?' · Prognose '+hm(r.prog.t):''); }
  }
  const k3 = '<div class="kpi '+cls+'"><div class="l">Rückzug in</div><div class="v" data-live="soll" data-t="'+t.id+'">'+v+'</div><div class="s">'+esc(s)+'</div></div>';
  return '<div class="kpis k3">'+k1+k2+k3+'</div>';
}
function membersHTML(t, r){
  const last = lastReading(t);
  const rows = t.mitglieder.map((m,i)=>{
    const p = last ? last.p[i] : (m.druck ?? null);
    const rd = r.soll ? r.soll.p[i] : null;
    const low = rd!=null && p!=null && p<=rd;
    return '<div class="mrow"><span class="mf">'+esc(m.funktion==='Truppführer'?'TF':m.funktion==='Truppmann'?'TM':'TM2')+'</span>'+
      '<span class="mn">'+esc(m.name||m.funktion)+'<small>'+esc(m.geraetNr||'Gerät –')+'</small></span>'+
      '<span class="mp'+(low?' low':'')+'">'+(p!=null?p+'<small> bar</small>':'–')+'</span>'+
      '<span class="mr">'+(rd!=null?rd+' bar':'–')+'</span></div>';
  }).join('');
  return '<div class="mtable"><div class="mrow mh"><span></span><span>Name / Gerät</span><span>'+(last?'Druck '+hm(last.t):'Flaschendruck')+'</span><span>Rückzug bei</span></div>'+rows+'</div>';
}
function cardHTML(t){
  const r = calc(t), nxt = nextStep(t,r);
  const st = r.alarms.length?'st-alarm':(r.warns.length?'st-warn':(r.status==='done'?'st-done':''));
  const alerts = r.alarms.map(a=>'<div class="alert alarm" role="alert">⚠ '+esc(a)+'</div>').join('') + r.warns.map(a=>'<div class="alert warn">'+esc(a)+'</div>').join('');
  const nstep = nxt && STEPS.find(s=>s.k===nxt);
  return '<article class="card '+st+'" id="card-'+t.id+'">'+
    '<div class="card-head"><div style="flex:1;min-width:0"><h3>'+esc(t.rufgruppe||'Trupp')+'</h3><div class="auftrag">'+esc(t.auftrag||'Auftrag offen')+'</div></div>'+statusPill(r)+'</div>'+
    alerts + kpiHTML(t,r) + membersHTML(t,r) +
    '<div class="tl">'+EVSTEPS.map(s=>tlStep(t,s,r,nxt)).join('')+'</div>'+
    (t.bemerkung?'<div class="note">'+esc(t.bemerkung)+'</div>':'')+
    '<div class="card-foot">'+
      (nstep?'<button class="btn primary nextbtn" data-act="step" data-t="'+t.id+'" data-s="'+nstep.k+'">'+esc(nstep.b)+'</button>':'<span class="note" style="flex:1">Einsatz des Trupps beendet</span>')+
      '<button class="btn small ghost" data-act="trupp" data-t="'+t.id+'">Bearbeiten</button>'+
      (t.ev.beginn && !t.ev.ende ? '<button class="btn notruf'+(t.notfall?' on':'')+'" data-act="notfall" data-t="'+t.id+'">'+(t.notfall?'Notfall beenden':'MAYDAY')+'</button>' : '')+
    '</div></article>';
}

let detailId = null;
let ovMode = (()=>{ try{ return sessionStorage.getItem('asue.ov')||'liste'; }catch(e){ return 'liste'; } })();
const OV_AB = 3;   // ab so vielen Trupps erscheint die Übersicht
function ovRowHTML(t){
  const r=calc(t), now=Date.now(), g=rank(t);
  const st = r.alarms.length?'st-alarm':(r.warns.length?'st-warn':'');
  const nq=nextQuery(t);
  let nqH;
  if(nq){ const left=nq.t-now; nqH='<div class="tm'+(left<=0?' warn':left<=10000?' blink':'')+'" data-blink="'+t.id+'"><b>'+hm(nq.t)+'</b><span data-live="nq" data-t="'+t.id+'">'+(left<=0?'fällig':dur(left))+'</span></div>'; }
  else nqH='<div class="tm"><b>–</b><span>'+(t.ev.ende?'beendet':t.ev.rueckzug?'Rückzug':t.ev.beginn?'erledigt':'ab Beginn')+'</span></div>';
  let rzH;
  if(t.ev.ende) rzH='<div class="tm"><b>'+hm(t.ev.ende.t)+'</b><span>Ende</span></div>';
  else if(t.ev.rueckzug) rzH='<div class="tm"><b>'+hm(t.ev.rueckzug.t)+'</b><span>Rückzug angetreten</span></div>';
  else if(r.soll && r.soll.sofort) rzH='<div class="tm alarm"><b>sofort!</b><span>Druck zu gering</span></div>';
  else if(r.soll){ const left=r.soll.t-now; rzH='<div class="tm'+(left<=0?' alarm':left<120000?' warn':'')+'"><b>'+hm(r.soll.t)+'</b><span data-live="soll" data-t="'+t.id+'">'+dur(left)+'</span></div>'; }
  else rzH='<div class="tm"><b>–</b><span>'+(t.ev.beginn?'nach Einsatzort an':'–')+'</span></div>';
  const msgs = r.alarms.map(x=>'<div class="alm">⚠ '+esc(x)+'</div>').join('') + (r.alarms.length?'':r.warns.map(x=>'<div class="alm w">'+esc(x)+'</div>').join(''));
  return '<button class="ovrow g'+g+' '+st+'" data-act="detail" data-t="'+t.id+'" aria-label="Detailansicht '+esc(t.rufgruppe)+'">'+
    '<div>'+statusPill(r)+'</div>'+
    '<div class="rg">'+esc(t.rufgruppe||'Trupp')+'</div>'+
    '<div class="au">'+esc(t.auftrag||'–')+'</div>'+
    nqH + rzH + '<div class="chev" aria-hidden="true">›</div>' + msgs + '</button>';
}

function refTable(){
  const c=S.config, start=300, zs=[290,280,270,260,250,240,230,220,210,200];

function truppStatus(){

function sendStatus(final){

  const body=JSON.stringify(statusPayload(final));
  sendState.busy=true; sendState.tried=Date.now();
  const sig=JSON.stringify(truppStatus())+S.einsatz.id;

/* ---------- Kamera + Texterkennung (OCR) ---------- */
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessWorker = null, tessLoading = null, ocrProgress = ()=>{};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Skript nicht ladbar')); document.head.appendChild(s); }); }
async function getWorker(){
  if(tessWorker) return tessWorker;
  if(!tessLoading) tessLoading = (async()=>{
    if(!window.Tesseract) await loadScript(TESS_URL);
    const w = await Promise.race([
      Tesseract.createWorker('deu', 1, {logger: m=>{ if(m.status==='recognizing text') ocrProgress(m.progress); }}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Zeitüberschreitung')), 45000))
    ]);
    tessWorker = w; return w;
  })().catch(e=>{ tessLoading=null; throw e; });
  return tessLoading;
}
function prepImage(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, 1800/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      const x = c.getContext('2d'); x.drawImage(img,0,0,c.width,c.height);
      const orig = document.createElement('canvas'); orig.width=c.width; orig.height=c.height; orig.getContext('2d').drawImage(c,0,0);
      const d = x.getImageData(0,0,c.width,c.height), a=d.data;
      let mn=255, mx=0; const g=new Uint8ClampedArray(a.length/4);
      for(let i=0,j=0;i<a.length;i+=4,j++){ const v=(a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114)|0; g[j]=v; if(v<mn)mn=v; if(v>mx)mx=v; }
      const span=Math.max(1,mx-mn);
      for(let i=0,j=0;i<a.length;i+=4,j++){ const v=((g[j]-mn)*255/span)|0; a[i]=a[i+1]=a[i+2]=v; }
      x.putImageData(d,0,0);
      res({canvas:c, orig, url});
    };
    img.onerror = ()=>rej(new Error('Bild nicht lesbar'));
    img.src = url;
  });
}

const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const FMT_NAMES = {qr_code:'QR-Code', QR_CODE:'QR-Code', data_matrix:'DataMatrix', DATA_MATRIX:'DataMatrix', code_128:'Code 128', CODE_128:'Code 128', code_39:'Code 39', CODE_39:'Code 39', ean_13:'EAN-13', EAN_13:'EAN-13', ean_8:'EAN-8', EAN_8:'EAN-8', itf:'ITF', ITF:'ITF', pdf417:'PDF417', PDF_417:'PDF417', aztec:'Aztec', AZTEC:'Aztec', upc_a:'UPC-A', UPC_A:'UPC-A', codabar:'Codabar', CODABAR:'Codabar'};

  // 2. Ersatz über ZXing (auch iPad/Safari)
  try{
    if(!window.ZXing) await loadScript(ZXING_URL);
    const Z = window.ZXing;
    const hints = new Map(); hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.MultiFormatReader(); reader.setHints(hints);
    const lumSource = c => {
      const w=c.width, h=c.height, d=c.getContext('2d').getImageData(0,0,w,h).data, l=new Uint8ClampedArray(w*h);
      for(let i=0,j=0;j<l.length;i+=4,j++) l[j]=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0;
      return new Z.RGBLuminanceSource(l, w, h);
    };
    const tryDecode = c => { try{ return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(lumSource(c)))); }catch(e){ return null; } };
    let r = tryDecode(canvas);
    if(!r){ // um 90° gedreht erneut versuchen (Strichcodes hochkant)
      const c2=document.createElement('canvas'); c2.width=canvas.height; c2.height=canvas.width;
      const x=c2.getContext('2d'); x.translate(c2.width/2,c2.height/2); x.rotate(Math.PI/2); x.drawImage(canvas,-canvas.width/2,-canvas.height/2);
      r = tryDecode(c2);
    }
    if(r){ const f=r.getBarcodeFormat(); const fn = Z.BarcodeFormat[f] || f; found.push({text:r.getText(), format:FMT_NAMES[fn]||String(fn)}); }
  }catch(e){}
  return found;
}
// Inhalt eines QR-Codes auf Felder verteilen: JSON {"name":…,"geraetNr":…} oder Zeilen "Name: …", "Gerät: …", "LA: …", "Flasche: …", "Maske: …"
const CODE_KEYS = [
  {k:'name', re:/^(name|traeger|träger|person)$/i},
  {k:'geraetNr', re:/^(ger(ae|ä)t|ger(ae|ä)te?-?nr|geraetnr|pa|pa-?nr|atemschutzger(ae|ä)t)$/i},
  {k:'laNr', re:/^(la|la-?nr|lanr|lungenautomat)$/i},
  {k:'flascheNr', re:/^(flasche|flaschen?-?nr|flaschenr|flaschenr\.?)$/i},
  {k:'maskeNr', re:/^(maske|masken?-?nr|maskenr)$/i}
];
function parseCode(text){
  const out = {};
  const t = String(text||'').trim();
  try{ const o = JSON.parse(t); if(o && typeof o==='object'){ Object.keys(o).forEach(key=>{ const hit = FIELDS.find(f=>f.k.toLowerCase()===key.toLowerCase()) || CODE_KEYS.find(c=>c.re.test(key)); if(hit && o[key]!=null) out[hit.k]=String(o[key]).trim(); }); } }catch(e){}
  if(!Object.keys(out).length){
    t.split(/[\n;|]+/).forEach(part=>{ const m=/^\s*([^:=]+?)\s*[:=]\s*(.+)$/.exec(part); if(!m) return; const hit=CODE_KEYS.find(c=>c.re.test(m[1].trim())); if(hit) out[hit.k]=m[2].trim(); });
  }
  return out;
}

/* ---------- Namen aus erkanntem Text ---------- */
function nameCandidates(lines){
  const W = "[A-ZÄÖÜ][a-zäöüß]+(?:-[A-ZÄÖÜ][a-zäöüß]+)?";
  const res = new Set();
  const STOP=/\b(feuerwehr|freiwillige|atemschutz|werkfeuerwehr|berufsfeuerwehr|jugendfeuerwehr|löschzug|loeschzug|stadt|gemeinde|name|gerät|geraet|flasche|maske)\b/i;
  lines.forEach(l0=>{
    if(STOP.test(l0)) return;
    const l = l0.replace(/^(name|nachname|träger|traeger)\s*[:.]?\s*/i,'').replace(/[^A-Za-zÄÖÜäöüß,\- ]/g,' ').replace(/\s+/g,' ').trim();
    let m;
    if((m = new RegExp('^('+W+')\\s*,\\s*('+W+')$').exec(l))) res.add(m[1]+', '+m[2]);
    else if((m = new RegExp('^('+W+')\\s+('+W+')$').exec(l))){ res.add(m[2]+', '+m[1]); res.add(m[1]+', '+m[2]); }
    else if((m = new RegExp('^('+W+')\\s+('+W+')\\s+('+W+')$').exec(l))) res.add(m[3]+', '+m[1]+' '+m[2]);
    else if(/^[A-ZÄÖÜ][A-ZÄÖÜ\-]{2,}$/.test(l)) res.add(l.charAt(0)+l.slice(1).toLowerCase());   // Namensschild in Großbuchstaben
    else if((m=/^([A-ZÄÖÜ][A-ZÄÖÜ\-]{2,})\s+([A-ZÄÖÜ][A-ZÄÖÜ\-]{1,})$/.exec(l))){ const cap=x=>x.charAt(0)+x.slice(1).toLowerCase(); res.add(cap(m[2])+', '+cap(m[1])); res.add(cap(m[1])+', '+cap(m[2])); }
  });
  return [...res].slice(0,8);
}
function candidates(text){
  const lines = text.split(/\n+/).map(l=>l.replace(/[|_~`]+/g,' ').replace(/\s+/g,' ').trim()).filter(l=>l.length>=3 && /[A-Za-zÄÖÜäöüß0-9]/.test(l));
  const toks = new Set();
  text.split(/[\s,;:|]+/).forEach(w=>{
    w = w.replace(/^[^A-Za-zÄÖÜäöüß0-9]+|[^A-Za-zÄÖÜäöüß0-9]+$/g,'');
    if(w.length<2) return;
    toks.add(w);
    const digits = (w.match(/\d/g)||[]).length;
    if(digits && digits/w.length >= .5){ const n=w.replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/S/g,'5').replace(/B/g,'8'); if(n!==w) toks.add(n); }
  });
  const arr=[...toks].sort((a,b)=>(/\d/.test(b)?1:0)-(/\d/.test(a)?1:0));
  const ul=[...new Set(lines)];
  return {lines:ul.slice(0,12), tokens:arr.slice(0,40), names:nameCandidates(ul)};
}
function openScan(m, onDone){
  const draft = {...m}; let active = 'name', imgUrl=null, result=null, codes=null, state='idle', errMsg='', mode='';
  const chipList = (arr, cls, field) => arr.map(x=>'<button class="chip'+(cls?' '+cls:'')+'" data-sc="pick" data-v="'+esc(x)+'"'+(field?' data-to="'+field+'"':'')+'>'+esc(x)+'</button>').join('');

    openDlg('<div class="dlg-head"><h2>Einlesen · '+esc(m.funktion)+'</h2><button type="button" class="btn small ghost" data-sc="cancel">Abbrechen</button></div>'+
      '<div class="dlg-body">'+
        '<div class="scanbtns">'+
          '<button class="btn primary" data-sc="shoot" data-mode="code">'+QR_SVG+' QR- / Strichcode</button>'+
          '<button class="btn primary" data-sc="shoot" data-mode="name">'+CAM_SVG.replace('<svg','<svg width="20" height="20"')+' Namensschild</button>'+

        (imgUrl?'<img class="scan-img" src="'+imgUrl+'" alt="Aufgenommenes Foto">':'')+
        (state==='busy'?'<div><div class="hint" id="ocrTxt">'+(mode==='code'?'Code wird gesucht …':'Texterkennung läuft …')+'</div><div class="progress"><div id="ocrBar"'+(mode==='code'?' style="width:60%"':'')+'></div></div></div>':'')+
        (state==='error'?'<div class="calcbox"><span class="err">'+esc(errMsg)+'</span> Das Foto bleibt sichtbar – Werte bitte unten abtippen.</div>':'')+
        (codes&&codes.length?'<div><div class="hint" style="margin-bottom:6px">Gefundene Codes</div><div class="chips">'+codes.map(c=>'<button class="chip" data-sc="pick" data-v="'+esc(c.text)+'"><small style="font-family:var(--f-body);color:var(--ink-3);margin-right:6px">'+esc(c.format)+'</small>'+esc(c.text.length>40?c.text.slice(0,40)+'…':c.text)+'</button>').join('')+'</div></div>':'')+
        (codes&&!codes.length&&mode==='code'&&state==='done'?'<div class="calcbox">Kein Code erkannt. Näher heran, Code gerade halten, Spiegelungen vermeiden – oder „Etikett / Text“ nutzen.</div>':'')+
        '<div><div class="hint" style="margin-bottom:6px">1. Feld wählen · 2. erkannten Wert antippen (springt zum nächsten Feld)</div><div class="fieldtabs">'+
          FIELDS.map(f=>'<button class="fieldtab" data-sc="field" data-f="'+f.k+'" aria-pressed="'+(active===f.k)+'"><small>'+f.l+'</small><span>'+esc(draft[f.k]||'–')+'</span></button>').join('')+'</div></div>'+
        '<label class="f">'+FIELDS.find(f=>f.k===active).l+'<input class="inp'+(active==='name'?'':' mono')+'" id="scanInp" value="'+esc(draft[active])+'"></label>'+
        (result?(
          (result.names.length?'<div><div class="hint" style="margin-bottom:6px">Erkannte Namen (setzt Name / Vorname)</div><div class="chips">'+chipList(result.names,'line name','name')+'</div></div>':(mode==='name'?'<div class="hint">Kein Name eindeutig erkannt – Zeile unten antippen oder abtippen.</div>':''))+
          (mode!=='name'?'<div><div class="hint" style="margin-bottom:6px">Erkannte Werte</div><div class="chips">'+(result.tokens.length?chipList(result.tokens):'<span class="hint">Keine Zeichen erkannt – näher heran oder besseres Licht.</span>')+'</div></div>':'')+
          (result.lines.length?'<div><div class="hint" style="margin-bottom:6px">Ganze Zeilen</div><div class="chips">'+chipList(result.lines,'line')+'</div></div>':'')):'')+
      '</div><div class="dlg-foot"><button class="btn primary" data-sc="ok" style="min-width:160px">Übernehmen</button></div>');
    const inp=$('#scanInp'); inp.addEventListener('input',()=>{ draft[active]=inp.value; const s=dlg.querySelector('.fieldtab[aria-pressed="true"] span'); if(s) s.textContent=inp.value||'–'; });
  };
  const nextField = () => { const i=FIELDS.findIndex(f=>f.k===active); active = FIELDS[Math.min(FIELDS.length-1,i+1)].k; };
  const applyCode = c => {
    const parsed = parseCode(c.text);
    if(Object.keys(parsed).length){ Object.assign(draft, parsed); const empty=FIELDS.find(f=>!draft[f.k]); active = empty?empty.k:active; return Object.keys(parsed).length; }
    if(active==='name' && /^\d|[0-9]{3,}/.test(c.text)) { const e=FIELDS.find(f=>f.k!=='name' && !draft[f.k]); if(e) active=e.k; }
    draft[active]=c.text.trim(); nextField(); return 1;
  };
  dlg.onclick = async e => {
    const b = e.target.closest('[data-sc]'); if(!b) return;
    const a = b.dataset.sc;
    if(a==='cancel'){ dlg.onclick=null; onDone ? onDone() : closeDlg(); }

    if(a==='pick'){ if(b.dataset.to){ draft[b.dataset.to]=b.dataset.v; active=b.dataset.to; nextField(); } else if(codes && codes.some(c=>c.text===b.dataset.v)) applyCode({text:b.dataset.v}); else { draft[active]=b.dataset.v; nextField(); } draw(); }
    if(a==='ok'){ FIELDS.forEach(f=>m[f.k]=(draft[f.k]||'').trim()); dlg.onclick=null; if(onDone) onDone(); else { S.sample=false; save(); closeDlg(); renderAll(); toast('Übernommen'); } }
    if(a==='shoot'){
      mode = b.dataset.mode;
      const fi = $('#fileCam'); fi.value='';
      fi.onchange = async () => {
        const file = fi.files && fi.files[0]; if(!file) return;
        let prepped;
        try{ prepped = await prepImage(file); }catch(err){ state='error'; errMsg=err.message+'.'; draw(); return; }
        imgUrl = prepped.url; state='busy'; result=null; codes=null; draw();
        // Codes werden bei jedem Foto gesucht (schnell); bei genau einem Code sofort übernehmen
        codes = await detectCodes(prepped.orig);
        if(codes.length===1){ const n=applyCode(codes[0]); toast(codes[0].format+' erkannt'+(n>1?' – '+n+' Felder ausgefüllt':'')); }
        if(mode==='code'){ state='done'; draw(); return; }
        ocrProgress = p => { const bar=$('#ocrBar'); if(bar) bar.style.width=Math.round(p*100)+'%'; };
        draw();
        try{
          const w = await getWorker();
          const txt=$('#ocrTxt'); if(txt) txt.textContent = mode==='name' ? 'Name wird gelesen …' : 'Text wird gelesen …';
          const { data } = await w.recognize(prepped.canvas);
          result = candidates(data.text||''); state='done';
          if(mode==='name' && result.names.length===1 && !draft.name){ draft.name=result.names[0]; active='name'; nextField(); }
          if(mode==='name') active = draft.name ? active : 'name';
        }catch(err){
          state='error'; errMsg = 'Texterkennung nicht verfügbar: Sie braucht beim ersten Start eine Internetverbindung (danach offline im Cache).';
        }
        draw();
      };
      fi.click();
    }
  };
  draw();
}

/* ---------- Audio / Vibration / Wachhalten ---------- */
let actx=null, wake=null;
function unlockAudio(){
  try{ if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
  if(!wake && navigator.wakeLock){ navigator.wakeLock.request('screen').then(w=>{wake=w; w.addEventListener('release',()=>wake=null);}).catch(()=>{}); }
}
function beep(alarm){
  try{ if(navigator.vibrate) navigator.vibrate(alarm?[300,150,300,150,300]:[200]); }catch(e){}
  if(!actx) return;
  const n = alarm?3:1;
  for(let i=0;i<n;i++){
    const o=actx.createOscillator(), g=actx.createGain(); o.type='square'; o.frequency.value=alarm?1150:880;
    const t0=actx.currentTime+i*0.35; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.25);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.3);
  }
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') { wake=null; unlockAudio(); } });

/* ---------- Meldung bei fälliger Abfrage ---------- */
const snooze = {};           // key -> Zeitpunkt, bis zu dem die Meldung ruht
let promptKey = null;
function duePrompts(now){
  const list=[];
  S.trupps.forEach(t=>{
    const ev=t.ev; if(!ev.beginn || ev.rueckzug || ev.ende) return;
    QUERIES.forEach(q=>{ const due=ev.beginn.t+q.min*60000; if(!ev[q.k] && now>=due) list.push({key:t.id+':'+q.k, t, k:q.k, due, kind:'abfrage', l:q.l}); });
    const r=calc(t,now);
    if(r.soll && (r.soll.sofort || now>=r.soll.t)) list.push({key:t.id+':rz', t, k:'rueckzug', due:r.soll.t, kind:'rueckzug', l:r.soll.sofort?'Rückzug sofort':'Rückzugszeit erreicht'});
  });
  return list.filter(p=>now >= (snooze[p.key]||0)).sort((a,b)=>(a.kind==='rueckzug'?-1:0)-(b.kind==='rueckzug'?-1:0) || a.due-b.due);
}
function showPrompt(p, now){
  promptKey = p.key;
  const t=p.t, isRz = p.kind==='rueckzug';
  const last = (()=>{ let l=null; for(const s of EVSTEPS) if(t.ev[s.k] && (!l||t.ev[s.k].t>=l.t)) l=t.ev[s.k]; return l; })();
  const mem = t.mitglieder.map((m,i)=>'<div><span>'+esc(m.name||m.funktion)+'</span><span class="mono">'+(last&&last.p[i]!=null?'zuletzt '+last.p[i]+' bar':'–')+'</span></div>').join('');
  openDlg('<div class="dlg-head"><h2>'+(isRz?'⚠ '+esc(p.l):'Druckabfrage fällig')+'</h2></div>'+
    '<div class="dlg-body">'+
      '<div><div style="font-family:var(--f-disp);font-size:26px;font-weight:700">'+esc(t.rufgruppe)+'</div><div class="hint">'+esc(t.auftrag||'')+'</div></div>'+
      '<div class="row" style="align-items:baseline"><span class="prompt-big" id="promptOver">'+dur(now-p.due)+'</span><span class="hint">'+(isRz?'seit Rückzugszeit '+hm(p.due):p.l+' seit '+hm(p.due)+' fällig')+'</span></div>'+
      '<div class="calcbox">'+(isRz?'Trupp über Funk zum Rückzug auffordern und Druck abfragen.':'Trupp über Funk rufen und Flaschendruck aller Truppmitglieder abfragen.')+'</div>'+
      '<div class="prompt-list">'+mem+'</div>'+
    '</div><div class="dlg-foot"><button class="btn" data-pr="later">In 1 min erinnern</button><span class="spacer"></span>'+
      '<button class="btn primary" data-pr="go" style="min-width:200px">'+(isRz?'Rückzug erfassen':'Druck jetzt erfassen')+'</button></div>', 'prompt'+(isRz?' alarm':''));
  dlg.onclick = e => {
    const b=e.target.closest('[data-pr]'); if(!b) return;
    snooze[p.key] = Date.now()+60000; promptKey=null; dlg.onclick=null;
    if(b.dataset.pr==='go') openStep(t.id, p.k, false); else closeDlg();
  };
  beep(isRz);
}
dlg.addEventListener('cancel', ()=>{ if(promptKey){ snooze[promptKey]=Date.now()+60000; promptKey=null; } });

function tick(){
  const now=Date.now();
  $('#clock').textContent = hms(now);
  if(promptKey){
    const el=$('#promptOver'); const p=duePrompts(now).find(x=>x.key===promptKey) || null;
    if(el && p) el.textContent = dur(now-p.due);
    if(!p && dlg.open && dlg.classList.contains('prompt')){ promptKey=null; closeDlg(); }
  } else if(!dlg.open){
    const p = duePrompts(now)[0]; if(p) showPrompt(p, now);
  }
  sendTick(now);
  if(view!=='ueb') return;
  const sig = S.trupps.map(t=>{const r=calc(t,now);return t.id+':'+r.alarms.join('|')+'/'+r.warns.join('|');}).join(';');
  if(sig!==alarmSig){
    const newAlarm = sig.split(';').some(x=>!alarmSig.includes(x) && /:[^\/]+\//.test(x));
    const newWarn = sig.split(';').some(x=>!alarmSig.includes(x) && /\/.+$/.test(x));
    const first = alarmSig==='';
    if(!dlg.open){ renderUeb(); if(!first && newAlarm) beep(true); }
    return;
  }
  S.trupps.forEach(t=>{
    const r=calc(t,now);
    const el=document.querySelector('[data-live="el"][data-t="'+t.id+'"]'); if(el && r.elapsed!=null) el.textContent=dur(r.elapsed);
    const nq=nextQuery(t), ne=document.querySelector('[data-live="nq"][data-t="'+t.id+'"]');
    if(ne && nq && nq.t>now){ ne.textContent=dur(nq.t-now); const bl=document.querySelector('[data-blink="'+t.id+'"]'); if(bl) bl.classList.toggle('blink', nq.t-now<=10000); }
    else if(ne && nq && ne.textContent!=='fällig'){ renderUeb(); return; }
    const so=document.querySelector('[data-live="soll"][data-t="'+t.id+'"]');
    if(so && r.soll && !r.soll.sofort && !t.ev.rueckzug && !t.ev.ende) so.textContent=dur(r.soll.t-now);
  });
}
